<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delphi Technology</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#0D1712;
    color:#F2F6F1;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .shapes { position:fixed; inset:0; z-index:0; overflow:hidden; }
  .shape {
    position:absolute;
    border-radius:50%;
    background:#2FBF71;
    opacity:0.09;
    filter:blur(6px);
    animation:float 22s ease-in-out infinite;
  }
  .s1 { width:420px; height:420px; top:-80px; left:-60px; animation-duration:26s; }
  .s2 { width:300px; height:300px; bottom:-70px; right:-40px; opacity:0.07; animation-duration:30s; }
  .s3 { width:180px; height:180px; top:20%; right:12%; opacity:0.06; animation-duration:19s; }
  .s4 { width:240px; height:240px; bottom:14%; left:10%; opacity:0.05; animation-duration:24s; }
  .s5 { width:120px; height:120px; top:60%; left:44%; opacity:0.06; animation-duration:17s; }
  @keyframes float {
    0%   { transform:translate(0,0) scale(1); }
    33%  { transform:translate(30px,-40px) scale(1.06); }
    66%  { transform:translate(-25px,25px) scale(0.96); }
    100% { transform:translate(0,0) scale(1); }
  }
  .content { position:relative; z-index:1; text-align:center; padding:24px; }
  h1 { font-size:clamp(48px, 9vw, 96px); font-weight:600; letter-spacing:0.01em; }
  .accent { color:#2FBF71; }
  .tag { margin-top:14px; font-size:clamp(15px,2.4vw,20px); font-weight:400; color:#C9D6CE; letter-spacing:0.02em; }
  .stealth { margin-top:10px; font-size:13px; letter-spacing:0.18em; text-transform:uppercase; color:#5f7a6c; }
  footer { position:fixed; bottom:26px; left:0; right:0; z-index:1; text-align:center; font-size:14px; color:#8aa295; }
  footer a { color:#2FBF71; text-decoration:none; }
  footer a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="shapes">
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
    <div class="shape s5"></div>
  </div>
  <div class="content">
    <h1>Delphi<span class="accent">.</span></h1>
    <div class="tag">AI efficiency research</div>
    <div class="stealth">In stealth</div>
  </div>
  <footer>
    <a href="mailto:contact@delphitechnology.org">contact@delphitechnology.org</a>
  </footer>
</body>
</html>
